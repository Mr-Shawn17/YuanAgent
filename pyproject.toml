[project]
name = "daily-chat-agent"
version = "0.1.0"
description = "以日常聊天为主场景的个人 AI Agent：Tools + RAG + MCP"
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4",
    "fastmcp>=4.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-mysql[asyncmy]>=3.0",
    "langfuse>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
tools = [
    "sympy>=1.13",
    "tavily-python>=0.7",
]
memory = [
    "langmem>=0.0.20",
]
runner = [
    "websockets>=13.0",
    "keyring>=25.0",
    "psutil>=6.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "alembic>=1.14",
]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "runner", "tests", "scripts"]
extend-exclude = ["data", "frontend", ".venv", ".trae", "scripts/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ASYNC"]
ignore = [
    "B008",
    "RET504",
    "ARG001",
    "ARG002",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend"]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = [
    "asyncmy",
    "asyncmy.*",
    "sympy.*",
    "yaml.*",
    "langgraph.checkpoint.mysql.*",
    "langgraph.store.mysql.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "online: 需要真实 API Key 与网络的测试，默认跳过",
    "mysql: 需要真实 MySQL 实例的测试，默认跳过",
    "mcp_subprocess: 需要拉起 mock MCP Server 子进程的集成测试，默认跳过",
    "rag_service: 需要启动 RAG MCP 服务（python scripts/rag/serve_mcp.py）的金标准评测，默认跳过",
    "slow: 耗时较长的测试",
]
