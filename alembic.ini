# NOTE: keep this file ASCII-only. Alembic reads it with encoding="locale"
# (GBK on zh-CN Windows), so non-ASCII comments raise UnicodeDecodeError.
# DSN is injected by migrations/env.py from Settings; no secrets live here.

[alembic]
script_location = migrations
prepend_sys_path = backend
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

; Percent signs: the [alembic] section is read by ConfigParser (interpolation on,
; so file_template needs %%), while the logging sections are consumed raw by
; logging.fileConfig (single % here). Do not "fix" one to match the other.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
