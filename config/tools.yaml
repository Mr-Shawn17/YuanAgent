# 内置工具装配配置（backend/app/tools/registry.py 读取）
#
# 字段说明：
#   enabled       是否启用该工具
#   tier          权限档位 read / write / danger；write 与 danger 执行前需要用户确认
#   requires_key  依赖的 Settings 密钥字段名，密钥缺失时自动禁用（如 tavily_api_key）
#   mode          预留给 search_knowledge_base 的 stub|mcp 切换（P1'-5 / P3'）
#
# sandbox_root 为文件类工具的沙箱根目录，相对路径按项目根解析；
# 沙箱外的路径（../、绝对路径）一律拒绝。
# default_allow: false 表示未在本文件列出的工具一律禁用。
#
# 文件工具的 mode 字段：
#   server  服务器进程直接读写 sandbox_root（CLI 场景=本机，等价旧行为）
#   local   经本地执行器（YuanRunner）读写用户电脑上的工作目录（Web 多人场景）
#           执行器未连接时工具返回 local_runner_offline 提示，不影响其他功能

sandbox_root: data/workspace
default_allow: false

tools:
  get_current_time:
    enabled: true
    tier: read

  calculator:
    enabled: true
    tier: read

  web_search:
    enabled: true
    tier: read
    requires_key: tavily_api_key

  list_directory:
    enabled: true
    tier: read
    mode: local

  read_file:
    enabled: true
    tier: read
    mode: local

  write_file:
    enabled: true
    tier: write
    mode: local

  # ===== 开发工作流四件套=====
  # 命令由用户本机 YuanRunner 固定 argv 拼装（无自由命令），
  # git 凭证存系统凭据库经 GIT_ASKPASS 注入，PAT 不进模型上下文。
  # 全部 danger 档：每次执行前 Web 审批弹窗展示将执行的操作。
  git_clone:
    enabled: true
    tier: danger
    mode: local

  git_commit_push:
    enabled: true
    tier: danger
    mode: local

  install_deps:
    enabled: true
    tier: danger
    mode: local

  # 编程任务整段委派给用户本机 codex CLI（自带 workspace-write 沙箱、
  # 用户自己的账号）；轻量单文件修改用 write_file 更省 token
  delegate_coding:
    enabled: true
    tier: danger
    mode: local

  remember:
    enabled: true
    tier: write

  # ===== 服务端沙箱化只读 git 查询（docs/sandbox-query.md）=====
  # 与四件套相反：命令在服务端 runsc（gVisor）容器内对只读副本执行，不经本机 runner。
  # read 档免审批的前提是每次执行都在沙箱内（无沙箱不执行，spec §2）；
  # 装配期 Docker Engine / runsc 不可达时工具整体自禁（requires_docker 语义，spec §12）。
  # 配置段见 config/agent.yaml 的 runtime.sandbox_query。
  git_query:
    enabled: true
    tier: read

  # rg 内容检索（PR3，spec §5 v1.1）：ripgrep 在同一沙箱容器对只读副本检索，
  # 选项白名单同 git_query 纪律；Engine 不可达时整体自禁
  rg_query:
    enabled: true
    tier: read

  # 知识库检索已由真实 RAG 服务（annual-report-rag，经 MCP 接入）提供，
  # 暴露 rag__search / rag__list_companies / rag__get_chunk_detail / rag__health。
  # 本地 stub 假数据工具已禁用，避免与真实 RAG 重复造成模型困惑。
  search_knowledge_base:
    enabled: false
    tier: read
    mode: stub

  # ===== 技能（Skills）=====
  # 依赖装配方注入 ToolContext.skill_catalog：skills 功能关闭或目录为空时
  # 工厂返回 None，registry 记禁用原因（不报错）。技能目录见 config/agent.yaml
  # 的 skills 段；SKILL.md 格式与脚本约束见 docs/usage.md。
  load_skill:
    enabled: true
    tier: read

  # danger 档首个成员：每次执行必须用户审批（终端询问 / Web 弹窗）
  execute_skill_script:
    enabled: true
    tier: danger
